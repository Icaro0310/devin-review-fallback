name: sonarcloud

# Reusable workflow: SonarCloud SAST analysis as a COMPLEMENTARY layer —
# it catches bugs/smells/security hotspots the semantic reviewers miss.
# It is NOT a substitute for review (it cannot judge intent); the
# Review Coverage gate stays authoritative.
#
# Free tier: unlimited analysis on PUBLIC repositories. Private repos
# need a paid plan — keep this caller-side on public repos only.
#
# Caller setup (one-time):
#   1. Import the org/repo at sonarcloud.io (GitHub login) — creates the
#      project key and binds the org.
#   2. Repo secret: SONAR_TOKEN (from sonarcloud.io -> My Account ->
#      Security). Repo variable: SONAR_PROJECT_KEY (org_projectKey).
#   3. Add sonar-project.properties at the caller repo root OR rely on
#      automatic analysis config below.
#
# This job runs on pull_request (not pull_request_target): SonarCloud
# scans the PR head itself — that is what it is for — inside the
# action's own sandbox, with no PR-controlled code executed by us.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preflight — token and project key present
        id: pre
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
          KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$KEY" ]; then
            echo "::notice::SONAR_TOKEN/SONAR_PROJECT_KEY unset — SonarCloud layer skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Caller runs under pull_request_target — checkout must point at
      # the PR head explicitly or the scan would analyze the base ref.
      # Safe here: the scanner reads sources statically, it never builds
      # or executes PR-controlled code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.pre.outputs.ok == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0   # shallow clone defeats blame-based issue attribution

      - name: SonarCloud scan
        if: steps.pre.outputs.ok == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ github.repository_owner }}
