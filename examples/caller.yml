# Copy this file to .github/workflows/review-fallback.yml in YOUR repo.
#
# Prerequisites (one-time setup):
#   1. The judge watcher (judge-watch, cron on your machine, gh auth that
#      can post commit statuses + check runs) — without it the
#      devin-judge/review verdict never lands and coverage stays
#      pending (never green).
#   2. For auto-merge: gh repo edit <you>/<repo> --enable-auto-merge
#   3. Pin to a release tag (@v1) instead of @main for supply-chain safety.
#
# No repo secrets or variables needed: the judge verdict is produced by
# the laptop-side watcher and static-scan is model-free.

name: review-fallback

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: read

jobs:
  fallback:
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
      id-token: write
    uses: Icaro0310/devin-review-fallback/.github/workflows/ai-review-fallback.yml@main
    # Optional inputs (defaults shown):
    #   with:
    #     wait-seconds: 180        # primary-reviewer wait before fallback
    #     judge-wait-minutes: 15   # judge job's devin-judge/review poll window
    secrets: inherit

  merge:
    # Skip non-PR events early for the merge path.
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Review Coverage' && github.event.state == 'success')
    permissions:
      contents: write
      pull-requests: write
    uses: Icaro0310/devin-review-fallback/.github/workflows/auto-merge.yml@main
    secrets: inherit

  # OPTIONAL complementary SAST layer (public repos — free tier).
  # Needs secrets.SONAR_TOKEN + vars.SONAR_PROJECT_KEY; skips cleanly
  # when unset. Trigger this one on pull_request (it scans the head).
